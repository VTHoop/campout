name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · Typecheck · Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:coverage

  rls:
    name: RLS policy tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      # Pinned: `latest` can silently change which images the tests run against.
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: pnpm install --frozen-lockfile
      # Anonymous ghcr.io pulls are throttled hardest on shared runners; the
      # workflow token raises the allowance and needs no extra secret.
      - run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
      # Policies are the only boundary between one family's children and
      # another's (ADR-0004). This job is not optional and not allowed to fail.
      # The tests need only Postgres, auth (gotrue), PostgREST and the kong
      # gateway; skipping the rest cuts ~12 image pulls to 4.
      - run: supabase start -x realtime,storage-api,imgproxy,mailpit,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
        env:
          # setup-cli exports ghcr.io here, which makes the CLI pull from ghcr.io
          # alone. Cleared, it tries public.ecr.aws, then ghcr.io, then Docker Hub.
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ''
      - run: pnpm test:rls
      - if: always()
        run: supabase stop

  smoke:
    name: Playwright smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.117.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USER: ${{ github.actor }}
      # Sign-in (CAM-41) needs auth and a mail catcher, so the smoke lane runs
      # against a local stack instead of the hosted project. Mailpit stays in;
      # the rest of what the RLS job skips stays out.
      - run: supabase start -x realtime,storage-api,imgproxy,postgres-meta,studio,edge-runtime,logflare,vector,supavisor
        env:
          SUPABASE_INTERNAL_IMAGE_REGISTRY: ''
      - name: Point the app at the local stack
        run: |
          supabase status -o json | jq -r '"NEXT_PUBLIC_SUPABASE_URL=\(.API_URL)", "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=\(.ANON_KEY)"' >> "$GITHUB_ENV"
      - run: pnpm e2e:smoke
      - if: always()
        run: supabase stop
